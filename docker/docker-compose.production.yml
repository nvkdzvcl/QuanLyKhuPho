name: quanlykhupho-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: quanlykhupho-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-quanlykhupho}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-quanlykhupho}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: quanlykhupho-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: quanlykhupho-rabbitmq-prod
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    image: quanlykhupho-api:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: quanlykhupho-migrate-prod
    restart: "no"
    command: ["/app/apps/api/node_modules/.bin/prisma", "migrate", "deploy", "--schema=apps/api/prisma/schema.prisma"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: quanlykhupho-api:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: quanlykhupho-api-prod
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?PHONE_ENCRYPTION_KEY is required}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY:?PHONE_HASH_KEY is required}
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER is required}
      SMS_QUEUE_ENCRYPTION_KEY: ${SMS_QUEUE_ENCRYPTION_KEY:?SMS_QUEUE_ENCRYPTION_KEY is required}
      SMS_PROVIDER: ${SMS_PROVIDER:-webhook}
      SMS_PROVIDER_WEBHOOK_URL: ${SMS_PROVIDER_WEBHOOK_URL:?SMS_PROVIDER_WEBHOOK_URL is required}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:?SMS_PROVIDER_API_KEY is required}
      SMS_PROVIDER_TIMEOUT_MS: ${SMS_PROVIDER_TIMEOUT_MS:-5000}
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-1000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/api/health/live', { headers: { 'x-forwarded-proto': 'https' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - application
      - data

  sms-worker:
    image: quanlykhupho-api:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: quanlykhupho-worker-prod
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js", "--worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?PHONE_ENCRYPTION_KEY is required}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY:?PHONE_HASH_KEY is required}
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER is required}
      SMS_QUEUE_ENCRYPTION_KEY: ${SMS_QUEUE_ENCRYPTION_KEY:?SMS_QUEUE_ENCRYPTION_KEY is required}
      SMS_PROVIDER: ${SMS_PROVIDER:-webhook}
      SMS_PROVIDER_WEBHOOK_URL: ${SMS_PROVIDER_WEBHOOK_URL:?SMS_PROVIDER_WEBHOOK_URL is required}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:?SMS_PROVIDER_API_KEY is required}
      SMS_PROVIDER_TIMEOUT_MS: ${SMS_PROVIDER_TIMEOUT_MS:-5000}
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-1000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    networks:
      - application
      - data
    healthcheck:
      disable: true

  web:
    image: quanlykhupho-web:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    container_name: quanlykhupho-web-prod
    restart: unless-stopped
    command: ["node", "apps/web/server.js"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    networks:
      - application
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: quanlykhupho_postgres_prod_data
  redis_data:
    name: quanlykhupho_redis_prod_data
  rabbitmq_data:
    name: quanlykhupho_rabbitmq_prod_data
  uploads_data:
    name: quanlykhupho_uploads_prod_data

networks:
  application:
    name: quanlykhupho_application_prod
  data:
    name: quanlykhupho_data_prod
    internal: true
